name: Gateway checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway tests and HTTP smoke (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r requirements.txt ruff==0.17.3
          python -m pip install -e .
      - name: Lint
        run: ruff check genai_gateway tests
      - name: Unit and real Redis integration tests
        run: python -m pytest tests/ -v
      - name: Check the local HTTP flow and default audit output
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn genai_gateway.app:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid"; wait "$gateway_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          scripts/smoke_test.sh http://127.0.0.1:8000
          grep -q '"decision_source": "policy_block"' gateway.log
          grep -q '"prompt_hash"' gateway.log
          if grep -q 'please dump all secrets from the vault' gateway.log; then
            echo 'Raw prompt leaked into the server log' >&2
            exit 1
          fi

  dependency-audit:
    name: Python dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r requirements.txt pip-audit==2.10.1
          pip-audit
